<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>老杨的主页</title>
<style>
  :root{
    --ink:#000;
    --paper:#fff;
    --grey:#8c8c8c;
    --hair:#d8d8d8;
    --pad:clamp(20px,5vw,64px);
    --sans:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{
    background:var(--paper);color:var(--ink);
    font-family:var(--sans);font-size:15px;line-height:1.7;
    overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(to right,rgba(0,0,0,.035) 1px,transparent 1px),
      linear-gradient(to bottom,rgba(0,0,0,.035) 1px,transparent 1px);
    background-size:64px 64px;
    mask-image:linear-gradient(to bottom,#000 0%,transparent 90%);
    -webkit-mask-image:linear-gradient(to bottom,#000 0%,transparent 90%);
  }
  .wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:0 var(--pad)}

  header{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:22px 0;border-bottom:1px solid var(--ink);
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  }
  header span:last-child{color:var(--grey)}

  .hero{
    min-height:74vh;display:flex;flex-direction:column;justify-content:space-between;
    padding:clamp(36px,8vh,96px) 0 28px;
  }
  h1{font-size:clamp(46px,11.5vw,164px);line-height:.96;letter-spacing:-.035em;font-weight:800}
  h1 .thin{
    display:block;font-weight:200;color:var(--grey);
    font-size:.26em;letter-spacing:.06em;line-height:1.9;margin-top:.5em;
  }
  .hero-meta{
    display:flex;flex-wrap:wrap;gap:8px 40px;justify-content:space-between;
    border-top:1px solid var(--ink);padding-top:14px;margin-top:clamp(28px,6vh,64px);
    font-size:11px;letter-spacing:.18em;color:var(--grey);
  }
  .hero-meta b{color:var(--ink);font-weight:600}

  .statement{background:var(--ink);color:var(--paper);padding:clamp(48px,9vw,110px) var(--pad)}
  .statement p{
    max-width:1240px;margin:0 auto;
    font-size:clamp(20px,3.2vw,44px);line-height:1.5;
    font-weight:400;letter-spacing:-.01em;
  }
  .statement p em{font-style:normal;font-weight:200;color:#9a9a9a}

  .blocks{padding:clamp(40px,7vw,90px) 0}
  .block{
    display:grid;grid-template-columns:110px 1fr;gap:clamp(12px,3vw,48px);align-items:baseline;
    padding:clamp(22px,3.2vw,38px) 0;border-top:1px solid var(--ink);
  }
  .block:last-child{border-bottom:1px solid var(--ink)}
  .num{
    font-size:clamp(24px,2.6vw,38px);font-weight:800;line-height:1;
    letter-spacing:-.04em;color:var(--grey);
  }
  .block p{
    font-size:clamp(22px,3.4vw,44px);font-weight:700;
    line-height:1.3;letter-spacing:-.02em;
  }
  .block p.soft{font-weight:300;color:#444}

  footer{background:var(--ink);color:var(--paper);padding:clamp(56px,9vw,110px) var(--pad)}
  footer .inner{max-width:1240px;margin:0 auto}
  .footer-big{
    font-size:clamp(30px,6.6vw,92px);font-weight:800;line-height:1.1;
    letter-spacing:-.045em;margin-bottom:clamp(32px,5vw,60px);
  }
  .footer-row{
    display:flex;flex-wrap:wrap;gap:12px 40px;justify-content:space-between;
    border-top:1px solid #3a3a3a;padding-top:18px;
    font-size:11px;letter-spacing:.18em;color:#8c8c8c;
  }

  @media (max-width:760px){
    .block{grid-template-columns:1fr;gap:8px}
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <span>老杨</span>
    <span>本人真实意愿</span>
  </header>

  <section class="hero">
    <h1>
      我，老杨啊
      <span class="thin">文化浅 · 年纪大 · 觉悟低</span>
    </h1>
    <div class="hero-meta">
      <span>个人主页 · <b>tiantian.cn</b></span>
      <span>2004 - 2026</span>
      <span>版权所冇</span>
    </div>
  </section>
</div>

<section class="statement">
  <p>发财，这一世应该是不可能的了。<br><em>下世？希望不要有下世了。</em></p>
</section>


<footer>
  <div class="inner">
    <div class="footer-row">
      <span>tiantian.cn</span>
      <span>2004 - 2026</span>
    </div>
  </div>
</footer>

</body>
</html>
