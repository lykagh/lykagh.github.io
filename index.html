<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="我，老杨啊。关于怎么走的一点点交代。">
<title>我，老杨啊</title>
<style>

  :root{
    --paper:#fbfaf8;
    --ink:#1c1a17;
    --ink-2:#4d4841;
    --muted:#8b857a;
    --faint:#bfb9ad;
    --line:#e6e1d7;

    --serif: "Songti SC", "Source Han Serif SC", "Noto Serif CJK SC",
             "STSong", "SimSun", Georgia, serif;
    --sans:  "PingFang SC", "Hiragino Sans GB", "Source Han Sans SC",
             "Microsoft YaHei", -apple-system, BlinkMacSystemFont, Arial, sans-serif;

    --measure:34em;   /* 一行约 34 个字 */
    --rhythm:1.9;     /* 行高 */
  }

  @media (prefers-color-scheme: dark){
    :root{
      --paper:#131211;
      --ink:#ece7dd;
      --ink-2:#b8b2a6;
      --muted:#7e786d;
      --faint:#4b4740;
      --line:#252320;
    }
  }

  *,*::before,*::after{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--serif);
    font-size:17px;
    line-height:var(--rhythm);
    -webkit-font-smoothing:antialiased;
  }

  ::selection{background:var(--ink); color:var(--paper);}

  .sheet{
    min-height:100vh;
    display:flex;
    align-items:center;
    padding:14vh clamp(24px, 8vw, 64px);
  }
  .sheet > .inner{
    width:100%;
    max-width:var(--measure);
    margin:0 auto;
  }

  /* ---------- 抬头 ---------- */
  .name{
    margin:0;
    font-size:27px;
    font-weight:600;
    line-height:1.5;
    letter-spacing:.05em;
  }
  .role{
    margin:10px 0 0;
    font-size:15px;
    letter-spacing:.12em;
    color:var(--muted);
  }
  .role + .role{margin-top:2px;}

  .label{
    margin:clamp(44px, 9vh, 72px) 0 0;
    font-family:var(--sans);
    font-size:11px;
    letter-spacing:.34em;
    color:var(--faint);
  }

  /* ---------- 交代 ---------- */
  .wish{
    margin:clamp(20px, 4vh, 30px) 0 0;
    padding:clamp(16px, 3vh, 24px) 0;
  }
  .wish h2{
    margin:0;
    font-size:20px;
    font-weight:600;
    line-height:1.6;
    letter-spacing:.05em;
  }
  .lines{
    margin:2px 0 0;
    padding:0;
    list-style:none;
    font-size:16px;
    color:var(--ink-2);
  }
  .note{
    margin:14px 0 0;
    font-family:var(--sans);
    font-size:12px;
    line-height:1.8;
    letter-spacing:.06em;
    color:var(--faint);
  }

  /* ---------- 落款 ---------- */
  .colophon{
    display:flex;
    flex-wrap:wrap;
    gap:4px clamp(18px, 4vw, 36px);
    margin:clamp(44px, 9vh, 72px) 0 0;
    padding-top:clamp(16px, 3vh, 24px);
    border-top:1px solid var(--line);
    font-family:var(--sans);
    font-size:12px;
    letter-spacing:.06em;
    color:var(--faint);
  }
  .colophon span{overflow-wrap:anywhere;}

  /* ---------- 响应式 ---------- */
  @media (max-width: 640px){
    body{font-size:16.5px;}
    .sheet{padding:9vh 22px 8vh; align-items:flex-start;}
    .name{font-size:24px;}
    .wish h2{font-size:19px;}
    .lines{font-size:15.5px;}
  }

  @media (max-width: 380px){
    .sheet{padding:7vh 18px 6vh;}
  }

  /* ---------- 打印 ---------- */
  @page{margin:22mm 20mm;}
  @media print{
    :root{
      --paper:#fff; --ink:#000; --ink-2:#2a2a2a; --muted:#666; --faint:#999; --line:#ddd;
    }
    .sheet{display:block; min-height:auto; padding:0;}
    .sheet > .inner{max-width:none; margin:0;}
    .wish{break-inside:avoid;}
  }
</style>
</head>
<body>

<main class="sheet">
  <div class="inner">

    <header>
      <h1 class="name">我，老杨啊</h1>
      <p class="role">文化浅 · 年纪大 · 觉悟低</p>
      <p class="role">发财，这一世应该是不可能的了。</p>
      <p class="role">下世？希望不要有下世了。</p>
    </header>

    <article class="wish">
      <h2>好好走</h2>
      <ul class="lines">
        <li>别得阿尔兹海默</li>
        <li>别抢救，让我走</li>
        <li>能选的话，我要安乐死</li>
        <li>剩下的，捐了</li>
      </ul>
      <p class="note">以上为本人真实意愿</p>
    </article>

    <footer class="colophon">
      <span>t@tiantian.cn</span>
      <span>汕头</span>
      <span>最后更新：2026 年 8 月</span>
    </footer>

  </div>
</main>

</body>
</html>
